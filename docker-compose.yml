name: bashgah360

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: club360_dev
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/club360_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: http://localhost:8089,http://127.0.0.1:8089,http://188.212.96.235:8089
      SSO_ISSUER: ${SSO_ISSUER:-http://188.212.96.235:8086}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-club360}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://188.212.96.235:8089/api/v1/auth/sso/callback}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz')\""]
      interval: 15s
      retries: 5

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/club360_dev
      REDIS_URL: redis://redis:6379/0
    depends_on: [backend]
    command: celery -A app.main.celery_app worker -l info

  beat:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/club360_dev
      REDIS_URL: redis://redis:6379/0
    depends_on: [backend]
    command: celery -A app.main.celery_app beat -l info

  frontend:
    build:
      context: ./frontend
      # v1.6 — آدرس هستهٔ عامل «دانشگاه هوشمند من» برای ویجت دستیار هوشمند
      args:
        VITE_MSU_AGENT_URL: ${VITE_MSU_AGENT_URL:-}
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8089:8089"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]

  # Optional S3-compatible private storage for development (SEC-09):
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
