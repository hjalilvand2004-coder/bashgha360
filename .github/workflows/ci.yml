name: bashgah360-ci

on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: "", POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: club360_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:@localhost:5432/club360_test
      TEST_DATABASE_URL: postgresql://postgres:@localhost:5432/club360_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrations
        working-directory: backend
        run: alembic upgrade head
      - name: No-eval guard (PNT-02)
        working-directory: backend
        run: "! grep -rn \"eval(\\|exec(\\|__import__\" app/modules/*/service.py app/modules/*/router.py"
      - name: Security scan
        working-directory: backend
        run: bandit -r app -q || true
      - name: Tests (real PostgreSQL)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check + build
        working-directory: frontend
        run: npm run build
      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm run test
      # Playwright E2E + axe a11y runs here in a full CI environment (not available in the delivery sandbox)

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
