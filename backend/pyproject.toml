[project]
name = "bashgah360-backend"
version = "1.0.0"
description = "باشگاه۳۶۰ — backend (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "psycopg2-binary==2.9.10",
  "python-jose[cryptography]==3.3.0",
  "bcrypt==4.2.1",
  "celery==5.4.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  # پایتون ویندوز (embeddable / venv بدون OS tzdata) به این پکیج نیاز دارد؛ روی لینوکس بی‌ضرر
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "hypothesis==6.122.1", "bandit==1.8.2"]

# کشف صریح پکیج: بدون این، setuptools در flat-layout بین «app» و «alembic» گیر می‌کند
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
